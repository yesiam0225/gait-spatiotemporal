[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gait-spatiotemporal"
version = "0.1.0"
description = "Spatiotemporal gait parameters and obstacle-crossing analysis from labeled marker CSV"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
]

[project.scripts]
spatiotemporal-gait = "spatiotemporal:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spatiotemporal"]

[tool.hatch.build.targets.sdist]
include = ["src/spatiotemporal", "README.md", "pyproject.toml"]
